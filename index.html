<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investment Monitoring System — PT Kayaba</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="backdrop" id="backdrop"></div>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">K</div>
        <div>
          <h1>KAYABA</h1>
          <span>Investment Monitoring</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">
        <b>Planning &amp; Budgeting Dept</b>
        <span>Investment Monitoring System v0.1</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="nav-toggle" id="navToggle" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div>
          <p class="crumb" id="crumb">Planning &amp; Budgeting Department</p>
          <h2 id="pageTitle">Executive Dashboard</h2>
        </div>
        <div class="topbar-actions">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" placeholder="Cari investasi...">
          </div>
          <button class="icon-btn" aria-label="Notifikasi">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="dot"></span>
          </button>
          <div class="avatar">NA</div>
        </div>
      </header>

      <div class="content">
        <section class="page is-active" id="page-executive"></section>
        <section class="page" id="page-progress"></section>
        <section class="page" id="page-budget"></section>
        <section class="page" id="page-production"></section>
        <section class="page" id="page-benefit"></section>
        <section class="page" id="page-action"></section>
      </div>
    </main>
  </div>

  <div class="modal" id="modal">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modalTitle"></h3>
        <button class="modal-close" id="modalClose" aria-label="Tutup">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
